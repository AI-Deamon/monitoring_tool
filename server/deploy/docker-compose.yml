# SentinelEdge Server - Docker Compose Configuration
# Production-ready setup with PostgreSQL

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sentinel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sentinel_edge_secure}
      POSTGRES_DB: sentinel_edge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_edge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_network

  # SentinelEdge Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinel:${DB_PASSWORD:-sentinel_edge_secure}@db:5432/sentinel_edge
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5050
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_PERIOD: ${RATE_LIMIT_PERIOD:-60}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      DB_POOL_SIZE: 10
      DB_POOL_RECYCLE: 3600
      DB_MAX_OVERFLOW: 20
    ports:
      - "5050:5050"
    volumes:
      - server_logs:/app/logs
    networks:
      - sentinel_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx Reverse Proxy (uncomment for SSL/TLS termination)
  # nginx:
  #   image: nginx:alpine
  #   container_name: sentinel_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     - server
  #   networks:
  #     - sentinel_network

volumes:
  postgres_data:
    driver: local
  server_logs:
    driver: local

networks:
  sentinel_network:
    driver: bridge
